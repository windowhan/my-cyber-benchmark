daemon off;
error_log logs/error.log;
pid logs/snx.pid;
worker_processes 1;
worker_connections 1024;

events {
    multi_accept on;
}

http {
    keepalive_timeout 75;
    keepalive_requests 100;
    client_max_body_size 8m;
    server_tokens on;
    etag on;
    merge_slashes on;
    sendfile on;
    tcp_nodelay on;
    chunked_transfer_encoding on;
    gzip on;
    gzip_static always;
    resolver 127.0.0.1:15353;
    open_file_cache max=64 inactive=60;
    lingering_close on;
    max_ranges 8;
    gzip_types text/plain text/html;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log logs/access.log main;

    upstream backend {
        server 127.0.0.1:9100 weight=3;
        server 127.0.0.1:9100 backup;
        keepalive 4;
    }

    upstream lt {
        least_time;
        queue max=1 timeout=2s;
        server 127.0.0.1:9100;
        server 127.0.0.1:9100;
    }

    upstream st {
        sticky cookie srv;
        server 127.0.0.1:9100;
        server 127.0.0.1:9100;
    }

    geo $country {
        default zz;
        127.0.0.0/8 us;
    }

    split_clients $arg_seed $variant {
        50% a;
        * b;
    }

    map $arg_x $m {
        default $arg_x$arg_x;
    }

    limit_req_zone $remote_addr zone=reqz:10m rate=10r/s;
    limit_conn_zone $remote_addr zone=connz:10m;

    proxy_cache_path html/.cache;

    server {
        listen 8080;
        server_name localhost *.local;

        root html;
        index index.html index.htm;

        location / {
            root html;
            index index.html;
            expires 1h;
            add_header X-Test on;
        }

        location = /exact {
            root html;
        }

        location /docs/ {
            alias html/;
        }

        location /r/ {
            rewrite ^/r/(.*)$ /docs/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa$1 break;
        }

        location /e/ {
            rewrite ^/e/(.*)$ /$1 break;
        }

        location /ssi/ {
            ssi on;
            root html;
        }

        location /slice/ {
            slice 64;
            ssi on;
            root html;
        }

        location /charset/ {
            charset utf-8;
            source_charset iso-8859-1;
            root html;
        }

        location /dav/ {
            dav_methods PUT DELETE MKCOL COPY MOVE;
            dav_ext ext;
            root html;
        }

        location /mp4/ {
            mp4;
            mp4_buffer_size 512k;
            root html;
        }

        location /aio/ {
            aio on;
            root html;
        }

        location /setv/ {
            set $v $arg_x;
            root html;
        }

        location /proxy/ {
            proxy_pass http://127.0.0.1:9100/;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_hide_header X-Hidden;
            proxy_redirect http://127.0.0.1:9100/ http://localhost:8080/;
            proxy_next_upstream error timeout http_502;
        }

        location /up/ {
            proxy_pass http://backend/;
            proxy_next_upstream error;
        }

        location /split/ {
            proxy_pass http://127.0.0.1:9101/;
        }

        location /dns/ {
            proxy_pass http://backend.local:9100/;
        }

        location /lt/ {
            proxy_pass http://lt/;
        }

        location /st/ {
            proxy_pass http://st/;
        }

        location /img/ {
            image_filter on;
        }

        location /xslt/ {
            xslt_stylesheet conf/style.xsl;
        }

        location /scgi/ {
            scgi_pass 127.0.0.1:9101;
        }

        location /grpc/ {
            grpc_pass 127.0.0.1:9102;
        }

        location /status {
            stub_status on;
        }

        location /gif {
            empty_gif;
        }

        location /auto/ {
            alias html/;
            autoindex on;
            add_trailer X-Index-Sig "snx";
        }

        location /try/ {
            try_files $uri $uri.html /index.html =404;
        }

        location /ret/ {
            return 201 "custom body $arg_x";
        }

        location /redir/ {
            return 302 /index.html;
        }

        location /errp/ {
            error_page 404 =200 /index.html;
            return 404;
        }

        location /sub/ {
            sub_filter "snx" "REPLACED";
            root html;
        }

        location /auth/ {
            auth_basic "realm";
            auth_basic_user_file conf/htpasswd;
            root html;
        }

        location /gunz/ {
            gunzip on;
            add_trailer X-Sum "ok";
        }
        location /add/ {
            add_before_body /add/before.txt;
            add_after_body  /add/after.txt;
            add_trailer     X-Trailer-A "sig";
            add_trailer     X-Trailer-B "v1";
        }
        location /addbig/ {
            add_before_body /add/before.txt;
            add_after_body  /add/big.txt;
        }
        location /jwt/ {
            auth_jwt on;
            root html;
        }
        location /deny/ {
            limit_except GET POST;

            deny all;
            root html;
        }

        location /rl/ {
            limit_req zone=reqz;
            root html;
        }

        location /cached/ {
            proxy_pass http://127.0.0.1:9100/;
            proxy_cache zone;
            proxy_cache_valid 200 60s;
            proxy_cache_use_stale error timeout updating;
            proxy_cache_key $uri;
        }

        location @named {
            return 200 "named location";
        }

        location /to_named/ {
            try_files $uri @named;
        }

        location ~ \.php$ {
            return 200 "regex location match";
        }

        location ^~ /images/ {
            root html;
        }
    }

    server {
        listen 8080;
        server_name api.example;
        return 200 "second vhost";
    }

    server {
        listen 8081 http2;
        listen 8444 quic;
        server_name h2.local;
        root html;
        location / {
            root html;
            index index.html;
        }
    }

    server {
        listen 8443 ssl;
        server_name tls.local;
        ssl_certificate conf/dev.crt;
        ssl_certificate_key conf/dev.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        root html;
        location / {
            root html;
            index index.html;
        }
        location /status {
            stub_status on;
        }
        ssl_session_cache shared:SNX:10m;
        ssl_session_timeout 5m;
    }

    server {
        listen 8443 ssl;
        server_name two.example;
        ssl_certificate conf/dev2.crt;
        ssl_certificate_key conf/dev2.key;
        root html;
        return 200 "vhost-two";
    }
}

mail {
    auth_http 127.0.0.1:9110;
    server {
        listen 8025;
        protocol smtp;
        server_name mail.local;
    }
    server {
        listen 8143;
        protocol imap;
    }
    server {
        listen 8110;
        protocol pop3;
    }
}

stream {
    listen 9000 proxy_protocol;
    listen 9001 preread;
    listen 9002 ssl;
    listen 9003 udp;
    ssl_certificate conf/dev.crt;
    ssl_certificate_key conf/dev.key;
    proxy_pass 127.0.0.1:9100;
    preread_route "GET /x" 127.0.0.1:9100;
    preread_route "SSH-2.0" 127.0.0.1:9022;
}

# feature flags exercised by the new directives
